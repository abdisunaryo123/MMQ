<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matematika Asyik 5B</title>
<style>
:root{--ink:#26325b;--cream:#fff6e0;--tomato:#ef4b3f;--mint:#17a673;--sky:#2f7cf6;--sun:#ffc531}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink);
background:radial-gradient(circle at 15% 10%,#ffe9a8 0 12%,transparent 13%),linear-gradient(#c9ecff,var(--cream) 60%)}
#app{max-width:920px;margin:0 auto;padding:12px}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 6px 0 var(--ink)}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:.2em 0;color:var(--tomato);text-shadow:2px 2px 0 var(--sun)}
h2{margin:.2em 0}
button{font:inherit;font-weight:800;cursor:pointer;border:3px solid var(--ink);border-radius:14px;padding:10px 18px;background:var(--tomato);color:#fff;box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky)}
button.b{background:var(--sky)}button.g{background:var(--mint)}button.y{background:var(--sun);color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lv{border:3px solid var(--ink);border-radius:18px;padding:12px;background:#fff;text-align:center;cursor:pointer;font-weight:700;box-shadow:0 4px 0 var(--ink)}
.lv.lock{opacity:.45;cursor:not-allowed}.lv .n{font-size:1.8rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;font-weight:800;line-height:1.05}
.fr b{border-bottom:3px solid currentColor;padding:0 5px}.fr i{font-style:normal;padding:0 5px}
.big{font-size:1.9rem}.q{font-size:1.25rem;line-height:1.5}
.bars{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.unit{display:flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden;width:110px;height:22px}
.unit span{flex:1;border-right:1px solid var(--ink);background:#f1f1f1}.unit span:last-child{border:0}.unit span.on{background:var(--c,#ff9f1c)}
.pz{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pz svg{width:150px;height:150px;touch-action:manipulation}.pz path{stroke:var(--ink);stroke-width:2;fill:#ffeab0;cursor:pointer;transition:fill .15s}.pz path.on{fill:var(--tomato)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:10px 0}
.cmp button{font-size:1.8rem;min-width:70px}
.cardf{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;min-width:72px;min-height:78px;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.slot{border:3px dashed var(--ink);background:#fff8;border-radius:14px;min-width:80px;min-height:92px;display:flex;align-items:center;justify-content:center;position:relative}
.slot em{position:absolute;top:-12px;left:-6px;background:var(--sun);border:2px solid var(--ink);border-radius:50%;width:26px;height:26px;text-align:center;font-style:normal;font-weight:800}
input[type=number]{width:74px;font:inherit;font-size:1.4rem;text-align:center;border:3px solid var(--ink);border-radius:10px;padding:6px}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}.fin hr{width:100%;border:2px solid var(--ink);margin:0}
#fb{border-radius:14px;padding:10px 14px;margin-top:10px;font-size:1.1rem;line-height:1.5}
.good{background:#d8f8e8;border:3px solid var(--mint)}.bad{background:#fff0d0;border:3px solid #e69500}
.prog{height:16px;background:#fff;border:3px solid var(--ink);border-radius:99px;overflow:hidden}.prog div{height:100%;background:var(--mint);transition:width .4s}
.star{font-size:2.4rem;filter:grayscale(1);opacity:.35}.star.on{filter:none;opacity:1;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.ach{display:inline-block;margin:3px;padding:4px 10px;border-radius:99px;border:2px solid var(--ink);background:#eee;font-size:.9rem}.ach.on{background:var(--sun)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script>
"use strict";
/* ===== Util ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),lcm=(a,b)=>a*b/gcd(a,b);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const NUM=f=>f.w*f.d+f.n;                       // pembilang pecahan tak biasa
const cmp=(a,b)=>Math.sign(NUM(a)*b.d-NUM(b)*a.d);
const fr=f=>{const p=f.n?`<span class="fr"><b>${f.n}</b><i>${f.d}</i></span>`:'';return (f.w?`<span class="big">${f.w}</span>`:'')+(p||(f.w?'':'0'))};
const mixed=(N,D)=>{const g=gcd(N,D);N/=g;D/=g;return {w:Math.floor(N/D),n:N%D,d:D}};
const bar=(f,c)=>{const N=NUM(f),u=Math.ceil(N/f.d)||1;let h='<div class="bars">';
 for(let i=0;i<u;i++){h+='<div class="unit" style="--c:'+c+'">';for(let k=0;k<f.d;k++)h+=`<span class="${i*f.d+k<N?'on':''}"></span>`;h+='</div>'}return h+'</div>'};
const $=id=>document.getElementById(id);

/* ===== Suara (WebAudio, lokal) ===== */
let AC=null,sndOn=true,musOn=false,musT=null;
function beep(f,d,t,v){if(!sndOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.15;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sOK=()=>{beep(660,.15);setTimeout(()=>beep(880,.2),120)},sNO=()=>beep(220,.25,'triangle'),sWIN=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*140)),sClk=()=>beep(500,.06,'square',.05);
function toggleMus(){musOn=!musOn;clearInterval(musT);if(musOn){const m=[523,659,784,659,587,698,880,698];let i=0;musT=setInterval(()=>beep(m[i++%8],.3,'sine',.04),420)}$('mus')&&($('mus').textContent=musOn?'🎵 Musik: Hidup':'🎵 Musik: Mati')}
function toggleSnd(){sndOn=!sndOn;$('snd').textContent=sndOn?'🔊 Suara':'🔇 Suara'}

/* ===== Simpan progres ===== */
let SV={stars:Array(10).fill(0),coins:0,best:Array(10).fill(0),ach:{}};
try{const s=JSON.parse(localStorage.getItem('ma5b'));if(s&&Array.isArray(s.stars)&&s.stars.length===10)SV=s}catch(e){}
const save=()=>{try{localStorage.setItem('ma5b',JSON.stringify(SV))}catch(e){}};

/* ===== Pembuat soal ===== */
const FAM=[[2,4],[3,6],[2,3],[3,4],[4,6],[2,5],[5,10],[4,8],[3,5],[6,8],[4,5],[6,9]];
const ADDT=[(a,b)=>`Ibu membeli ${a} kg gula dan ${b} kg tepung. Berapa kg seluruh belanjaan Ibu?`,(a,b)=>`Dina minum ${a} liter susu pagi hari dan ${b} liter sore hari. Berapa liter yang ia minum?`,(a,b)=>`Pita merah panjangnya ${a} m dan pita biru ${b} m. Jika disambung, berapa panjangnya?`];
const SUBT=[(a,b)=>`Ayah punya ${a} liter minyak, lalu memakai ${b} liter. Berapa liter sisanya?`,(a,b)=>`Tali sepanjang ${a} m dipotong ${b} m. Berapa m sisa tali?`,(a,b)=>`Chef punya ${a} loyang kue, terjual ${b} loyang. Berapa loyang yang tersisa?`];
function mk(d,m){return {w:m?R(1,3):0,n:R(1,d-1),d}}
function qBuild(L){const d=pick([2,3,4,5,6,8]);const m=L.mix&&Math.random()<.6;const f={w:m?1:0,n:R(1,d-1),d};
 return {t:'build',f,hint:L.hint,text:`Warnai pizza sehingga menunjukkan ${fr(f)} bagian. Ketuk potongan pizza!`}}
function qCmp(L){let a,b;
 do{const k=L.kind;
  if(k==='same'){const d=pick([4,5,6,8,10,12]);a={w:0,n:R(1,d-1),d};b={w:0,n:R(1,d-1),d};if(Math.random()<.4){const n=R(1,9),d1=R(n+1,12),d2=R(n+1,12);a={w:0,n,d:d1};b={w:0,n,d:d2}}}
  else{const[d1,d2]=pick(FAM);a=mk(d1,Math.random()<.5);b=mk(d2,a.w>0&&Math.random()<.6);if(Math.random()<.2){b={w:a.w,n:a.n*2%d2||1,d:d2*2};}}
 }while(a.d===0||(cmp(a,b)===0&&L.kind==='same'));
 return {t:'cmp',a,b,hint:L.hint,text:'Bandingkan dua pecahan ini. Mana tanda yang benar?'}}
function qOrder(L){let items,v;do{items=[];const c=L.cnt;for(let i=0;i<c;i++){const d=pick([2,3,4,5,6,8,10,12]);items.push(L.mix?{w:R(0,3),n:R(1,d-1),d}:{w:0,n:R(1,d-1),d})}
 v=items.map(x=>NUM(x)/x.d)}while(new Set(v.map(x=>x.toFixed(6))).size<items.length);
 const asc=L.dir==='asc'||(L.dir==='mix'&&Math.random()<.5);
 return {t:'order',items,asc,hint:L.hint,text:`Urutkan kartu dari yang <b>${asc?'terkecil ke terbesar':'terbesar ke terkecil'}</b>. Ketuk kartu satu per satu!`}}
function qCalc(L){let A,B,[d1,d2]=L.same?(()=>{const d=pick([4,5,6,8,10,12]);return[d,d]})():pick(FAM);
 let t=0;do{A=mk(d1,L.mix);B=mk(d2,L.mix);t++}while(L.op==='-'&&cmp(A,B)<=0&&t<200);
 if(L.op==='-'&&cmp(A,B)<=0){A.w+=1}
 const N=L.op==='+'?NUM(A)*B.d+NUM(B)*A.d:NUM(A)*B.d-NUM(B)*A.d,D=A.d*B.d;
 const T=pick(L.op==='+'?ADDT:SUBT);
 return {t:'calc',A,B,op:L.op,N,D,hint:L.hint,text:T(fr(A),fr(B))}}

/* ===== Daftar level ===== */
const LV=[
{n:'Warnai Pizza',goal:'Menyatakan pecahan sebagai bagian dari keseluruhan.',story:'Chef Pipi membuka Restoran Pecahan! Bantu ia mewarnai pizza sesuai pesanan pelanggan.',g:qBuild,hint:'Penyebut = jumlah seluruh potongan sama besar. Pembilang = jumlah potongan yang diwarnai.'},
{n:'Pizza Sama Penyebut',goal:'Membandingkan pecahan berpenyebut sama atau berpembilang sama.',story:'Dua pelanggan berebut pizza. Siapa yang mendapat bagian lebih besar?',g:qCmp,kind:'same',hint:'Penyebut sama: pembilang lebih besar = lebih besar. Pembilang sama: penyebut lebih kecil = potongan lebih besar.'},
{n:'Pasar Kue',goal:'Membandingkan pecahan biasa dan campuran berpenyebut berbeda.',story:'Di pasar kue, Chef Pipi memilih porsi tepung terbanyak. Samakan penyebutnya dulu!',g:qCmp,kind:'diff',hint:'Pecahan campuran: bandingkan bilangan bulatnya dulu. Jika sama, samakan penyebut lalu bandingkan pembilang.'},
{n:'Lomba Lari',goal:'Mengurutkan pecahan biasa.',story:'Tiga murid berlari. Urutkan jarak yang mereka tempuh!',g:qOrder,cnt:3,dir:'asc',mix:false,hint:'Samakan penyebutnya (KPK), lalu urutkan pembilangnya.'},
{n:'Rak Resep',goal:'Mengurutkan pecahan biasa dan campuran.',story:'Susun bahan resep dari takaran yang diminta chef.',g:qOrder,cnt:4,dir:'mix',mix:true,hint:'Bilangan bulat lebih besar berarti pecahan campuran lebih besar. Jika sama, banding pecahannya.'},
{n:'Tambah Sama Penyebut',goal:'Menjumlahkan pecahan berpenyebut sama.',story:'Dapur ramai! Jumlahkan bahan-bahan yang dipakai.',g:qCalc,op:'+',same:true,mix:false,hint:'Penyebut tetap, jumlahkan pembilangnya. Jika hasil lebih dari 1, ubah ke pecahan campuran.'},
{n:'Kurang Sama Penyebut',goal:'Mengurangkan pecahan berpenyebut sama.',story:'Stok bahan menipis. Hitung sisa bahan di gudang!',g:qCalc,op:'-',same:true,mix:false,hint:'Penyebut tetap, kurangkan pembilangnya.'},
{n:'Tambah Beda Penyebut',goal:'Menjumlahkan pecahan berpenyebut berbeda.',story:'Resep spesial butuh dua bahan berbeda takaran. Samakan penyebutnya!',g:qCalc,op:'+',same:false,mix:false,hint:'Cari KPK kedua penyebut, ubah kedua pecahan, lalu jumlahkan pembilangnya.'},
{n:'Kurang Beda Penyebut',goal:'Mengurangkan pecahan berpenyebut berbeda.',story:'Pelanggan memesan banyak. Berapa sisa bahan setelah dipakai?',g:qCalc,op:'-',same:false,mix:false,hint:'Samakan penyebut dengan KPK, lalu kurangkan pembilangnya.'},
{n:'Raja Pecahan Campuran',goal:'Menjumlah dan mengurang pecahan campuran.',story:'Tantangan terakhir dari Raja Pecahan! Selesaikan pecahan campuran.',g:qCalc,op:'?',same:false,mix:true,hint:'Ubah pecahan campuran menjadi pecahan biasa, samakan penyebut, hitung, lalu ubah kembali.'}
];
const ACH=[['star1','⭐ Bintang Pertama',()=>SV.stars.some(s=>s>0)],['perf','🌟 Sempurna (3 bintang)',()=>SV.stars.some(s=>s===3)],['half','🍕 Setengah Jalan (Level 5)',()=>SV.stars[4]>0],['coin','💰 Kolektor 100 Koin',()=>SV.coins>=100],['all','👑 Raja Pecahan (semua level)',()=>SV.stars.every(s=>s>0)],['combo','🔥 Combo 5 Beruntun',()=>SV.ach.combo5]];

/* ===== Status permainan ===== */
let S=null;
const app=h=>{$('app').innerHTML=h};
const hdr=()=>`<div class="top"><span class="pill">🪙 ${SV.coins}</span><span><button class="y" id="snd" onclick="toggleSnd()">${sndOn?'🔊 Suara':'🔇 Suara'}</button> <button class="y" id="mus" onclick="toggleMus()">${musOn?'🎵 Musik: Hidup':'🎵 Musik: Mati'}</button></span></div>`;

function menu(){
 let g='';LV.forEach((l,i)=>{const open=i===0||SV.stars[i-1]>0;
  g+=`<div class="lv ${open?'':'lock'}" ${open?`onclick="start(${i})"`:''} role="button" tabindex="0"><div class="n">${open?i+1:'🔒'}</div>${l.n}<div>${'⭐'.repeat(SV.stars[i])}${'☆'.repeat(3-SV.stars[i])}</div></div>`});
 app(`${hdr()}<div class="card" style="text-align:center"><h1>🍕 Matematika Asyik 5B</h1><p class="q">Bantu <b>Chef Pipi</b> menjalankan restoran dengan ilmu <b>pecahan</b>!<br>Bandingkan, urutkan, jumlahkan, dan kurangkan pecahan.</p></div>
 <div class="card"><h2>Pilih Level</h2><div class="grid">${g}</div></div>
 <div class="card"><h2>Pencapaian</h2>${ACH.map(a=>`<span class="ach ${SV.ach[a[0]]?'on':''}">${a[1]}</span>`).join('')}<p><button class="b" onclick="if(confirm('Hapus semua progres?')){SV={stars:Array(10).fill(0),coins:0,best:Array(10).fill(0),ach:{}};save();menu()}">Hapus Progres</button></p></div>`)}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('lv')){e.preventDefault();e.target.click()}});

function start(i){const L=LV[i];S={i,q:0,cor:0,score:0,combo:0,maxc:0,att:0,hint:false,done:false,cur:null,pick:[]};
 app(`${hdr()}<div class="card"><h2>Level ${i+1}: ${L.n}</h2><p class="q">📖 ${L.story}</p><p class="q">🎯 <b>Tujuan:</b> ${L.goal}</p><p>✅ <b>Syarat lulus:</b> minimal 3 dari 5 soal benar.</p><button class="g" onclick="nextQ()">Mulai Misi!</button> <button class="b" onclick="menu()">Kembali</button></div>`)}

function nextQ(){if(S.q>=5)return finish();const L=LV[S.i];const Lp=Object.assign({},L);if(L.op==='?')Lp.op=Math.random()<.5?'+':'-';
 S.cur=L.g(Lp);S.att=0;S.hint=false;S.done=false;S.pick=[];S.q++;draw()}

function draw(){const q=S.cur,L=LV[S.i];let body='';
 if(q.t==='build'){const tot=NUM(q.f),np=q.f.w?2:1;let h='<div class="pz">';
  for(let p=0;p<np;p++){h+='<svg viewBox="-52 -52 104 104">';for(let k=0;k<q.f.d;k++){const a0=2*Math.PI*k/q.f.d-Math.PI/2,a1=2*Math.PI*(k+1)/q.f.d-Math.PI/2;
   h+=`<path data-s="1" onclick="tog(this)" d="M0 0L${50*Math.cos(a0)} ${50*Math.sin(a0)}A50 50 0 ${q.f.d===1?1:0} 1 ${50*Math.cos(a1)} ${50*Math.sin(a1)}Z"></path>`}h+='</svg>'}
  body=h+'</div>'+`<p style="text-align:center">Setiap pizza dibagi menjadi ${q.f.d} potongan sama besar.</p>`}
 if(q.t==='cmp')body=`<div class="row"><span style="font-size:1.6rem">${fr(q.a)}</span><span class="big">?</span><span style="font-size:1.6rem">${fr(q.b)}</span></div><div class="row cmp"><button onclick="ansCmp(-1)">&lt;</button><button class="y" onclick="ansCmp(0)">=</button><button class="b" onclick="ansCmp(1)">&gt;</button></div>`;
 if(q.t==='order'){q.idx=q.items.map((_,i)=>i);body=`<div class="row" id="slots"></div><div class="row" id="pool"></div><div class="row"><button class="g" id="chk" onclick="ansOrder()">Cek Urutan</button><button class="b" onclick="S.pick=[];drawOrder()">Ulangi Susunan</button></div>`}
 if(q.t==='calc')body=`<div class="row"><span class="q">Jawaban:</span><input id="iw" type="number" min="0" placeholder="bulat" aria-label="bilangan bulat"> <span class="fin"><input id="in" type="number" min="0" placeholder="atas" aria-label="pembilang"><hr><input id="id" type="number" min="1" placeholder="bawah" aria-label="penyebut"></span><button class="g" onclick="ansCalc()">Cek</button></div><p style="text-align:center;font-size:.95rem">Boleh ditulis sebagai pecahan campuran atau pecahan biasa.</p>`;
 app(`${hdr()}<div class="card"><div class="top"><b>Level ${S.i+1}: ${L.n}</b><span class="pill">Soal ${S.q}/5</span><span class="pill">⭐ ${S.score}</span><span class="pill">🔥 x${S.combo}</span></div><div class="prog" style="margin-top:8px"><div style="width:${(S.q-1)*20}%"></div></div></div>
 <div class="card"><p class="q">${q.text}</p>${body}<div class="row"><button class="y" onclick="hint()">💡 Petunjuk</button><button class="b" onclick="menu()">Menu</button></div><div id="fb" aria-live="polite"></div><div class="row" id="nx"></div></div>`);
 if(q.t==='order')drawOrder()}

function tog(el){if(S.done)return;el.classList.toggle('on');sClk();const c=document.querySelectorAll('.pz path.on').length;const f=S.cur.f;
 if(c===NUM(f)){setTimeout(()=>{if(document.querySelectorAll('.pz path.on').length===NUM(f))resolve(true,`Hebat! ${fr(f)} berarti ${NUM(f)} potongan diwarnai dari pizza yang dibagi ${f.d} sama besar.`)},350)}}
function drawOrder(){const q=S.cur;$('slots').innerHTML=q.items.map((_,s)=>{const i=S.pick[s];return `<div class="slot"><em>${s+1}</em>${i!=null?`<button class="cardf" onclick="unpick(${s})">${fr(q.items[i])}</button>`:''}</div>`}).join('');
 $('pool').innerHTML=q.items.map((f,i)=>S.pick.includes(i)?'':`<button class="cardf" onclick="pk(${i})">${fr(f)}</button>`).join('');$('chk').disabled=S.pick.length<q.items.length}
function pk(i){if(S.done)return;S.pick.push(i);sClk();drawOrder()}
function unpick(s){if(S.done)return;S.pick.splice(s,1);drawOrder()}

function hint(){if(S.done)return;S.hint=true;fb(`💡 ${S.cur.hint}`,'bad')}
function fb(h,c){$('fb').className=c;$('fb').innerHTML=h}

function ansCmp(s){if(S.done)return;const q=S.cur,c=cmp(q.a,q.b);const sym=['&lt;','=','&gt;'][c+1];
 const L=lcm(q.a.d,q.b.d);const ex=`Samakan penyebut ke ${L}: ${fr(q.a)} = ${NUM(q.a)*L/q.a.d}/${L} dan ${fr(q.b)} = ${NUM(q.b)*L/q.b.d}/${L}. Jadi ${fr(q.a)} ${sym} ${fr(q.b)}.`;
 resolve(s===c,ex,bar(q.a,'#ff9f1c')+bar(q.b,'#2f7cf6'))}
function ansOrder(){if(S.done)return;const q=S.cur;const v=S.pick.map(i=>NUM(q.items[i])/q.items[i].d);let ok=true;for(let i=1;i<v.length;i++)if(q.asc?v[i]<v[i-1]-1e-9:v[i]>v[i-1]+1e-9)ok=false;
 const sorted=q.items.slice().sort((a,b)=>q.asc?cmp(a,b):cmp(b,a));
 resolve(ok,`Urutan yang benar: ${sorted.map(fr).join(q.asc?' &lt; ':' &gt; ')}. Samakan penyebut agar mudah dibandingkan.`)}
function ansCalc(){if(S.done)return;const q=S.cur;const w=$('iw').value===''?0:parseInt($('iw').value,10),n=$('in').value===''?0:parseInt($('in').value,10),d=parseInt($('id').value,10);
 if(isNaN(w)||isNaN(n)||isNaN(d)||d<=0||w<0||n<0){fb('Isi penyebut (angka bawah) dengan bilangan lebih dari 0, dan jangan gunakan angka negatif.','bad');return}
 const N=w*d+n;const ok=N*q.D===q.N*d;const r=mixed(q.N,q.D);const L=lcm(q.A.d,q.B.d);
 const ex=`${q.A.w||q.B.w?'Ubah ke pecahan biasa: '+NUM(q.A)+'/'+q.A.d+' dan '+NUM(q.B)+'/'+q.B.d+'. ':''}${q.A.d===q.B.d?'Penyebut sama, ':'KPK = '+L+'. '}hitung: ${NUM(q.A)*L/q.A.d}/${L} ${q.op} ${NUM(q.B)*L/q.B.d}/${L} = ${q.op==='+'?NUM(q.A)*L/q.A.d+NUM(q.B)*L/q.B.d:NUM(q.A)*L/q.A.d-NUM(q.B)*L/q.B.d}/${L}. Bentuk sederhana: ${fr(r)}.`;
 let note='';if(ok){const g=gcd(n,d);if((n&&g>1)||(n>=d&&d>0))note=` Kerja bagus! Bentuk paling sederhananya: ${fr(r)}.`}
 resolve(ok,ex,'',note)}

function resolve(ok,ex,extra,note){const L=LV[S.i];extra=extra||'';
 if(ok){S.done=true;let pts=S.att===0?(S.hint?7:10):5;let bonus=0;if(S.att===0){S.combo++;S.maxc=Math.max(S.maxc,S.combo);bonus=Math.min(S.combo-1,5)*2}else S.combo=0;
  S.score+=pts+bonus;S.cor++;sOK();fb(`✅ <b>Benar!</b> +${pts}${bonus?` (+${bonus} bonus combo 🔥)`:''}<br>${ex}${note||''}${extra}`,'good')}
 else{S.att++;S.combo=0;sNO();
  if(S.att<2){fb(`🤔 Belum tepat, tidak apa-apa! Coba lagi.<br>💡 ${S.cur.hint}`,'bad');if(S.cur.t==='order'){S.pick=[];drawOrder()}return}
  S.done=true;fb(`📘 Jawaban yang benar:<br>${ex}${extra}`,'bad')}
 $('nx').innerHTML=`<button class="g" onclick="nextQ()">${S.q>=5?'Lihat Hasil':'Soal Berikutnya ➜'}</button>`}

function finish(){const i=S.i,st=S.cor>=5?3:S.cor===4?2:S.cor===3?1:0,pass=st>0;let coins=Math.round(S.score/5)+(pass?5:0);
 if(pass){SV.stars[i]=Math.max(SV.stars[i],st);SV.coins+=coins}
 SV.best[i]=Math.max(SV.best[i],S.score);if(S.maxc>=5)SV.ach.combo5=true;
 const newA=[];ACH.forEach(a=>{if(!SV.ach[a[0]]&&a[2]()){SV.ach[a[0]]=true;newA.push(a[1])}});save();pass?sWIN():sNO();
 app(`${hdr()}<div class="card" style="text-align:center"><h1>${pass?'🎉 Level Selesai!':'Ayo Coba Lagi!'}</h1><div>${[1,2,3].map(n=>`<span class="star ${n<=st?'on':''}">⭐</span>`).join('')}</div>
 <p class="q">Benar: <b>${S.cor}/5</b> &nbsp; Skor: <b>${S.score}</b> &nbsp; Koin: <b>+${pass?coins:0}</b> &nbsp; Combo terbaik: <b>${S.maxc}</b></p>
 <p class="q">${pass?'Kamu hebat! Pecahan makin asyik, bukan?':'Belum 3 soal benar. Baca petunjuk dan coba lagi — kesalahan adalah cara belajar!'}</p>
 ${newA.length?`<p>🏅 Pencapaian baru: ${newA.map(a=>`<span class="ach on">${a}</span>`).join('')}</p>`:''}
 <button class="y" onclick="start(${i})">Main Lagi</button> ${pass&&i<9?`<button class="g" onclick="start(${i+1})">Level Berikutnya ➜</button>`:''} <button class="b" onclick="menu()">Menu</button></div>`)}

window.addEventListener('error',()=>{});
menu();
</script></body></html>
